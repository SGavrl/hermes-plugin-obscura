manifest_version: 1
name: browser-obscura
version: 1.0.0
description: "Obscura local headless browser backend. Spawns `obscura serve` and drives it over CDP, a Rust engine with no Chrome or Node dependency (~70 MB binary, ~30 MB RAM). Opt-in via browser.cloud_provider: obscura; never auto-selected."
author: SGavrl
kind: backend
provides_browser_providers:
  - obscura
provides_tools: []
provides_hooks: []
