[project]
name = "hermes-plugin-obscura"
version = "1.0.1"
description = "Obscura browser backend for Hermes, using a local or remote CDP server."
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = [
    "requests",
]

[project.optional-dependencies]
test = [
    "pytest",
    "requests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode imports each test module in isolation, so the repo-root
# __init__.py (a Hermes plugin package entry, not a test package) is never
# pulled into collection.
addopts = "-q --import-mode=importlib"
